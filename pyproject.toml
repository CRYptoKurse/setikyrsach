[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seti-overlay"
version = "0.1.0"
description = "Учебный прототип защищенной Kademlia P2P overlay-сети"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
seti-overlay = "overlay.cli:main"

[tool.setuptools]
packages = ["overlay"]